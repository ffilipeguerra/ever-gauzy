# Gauzy na VPS da SGQ, atrás do Traefik do Easypanel (docker compose, não swarm).
#
# O Traefik do Easypanel roda em swarm e não lê etiquetas de contêiner de compose.
# Mesmo caminho do sgq-bridge: a tela entra na rede `easypanel` com um apelido, e o
# arquivo traefik-gauzy.yaml, copiado para /etc/easypanel/traefik/config/, aponta
# o domínio para esse apelido. O Easypanel só reescreve main.yaml, então o arquivo
# de rota próprio sobrevive às regerações dele.
#
# Enxuto de propósito: banco, API e tela. Sem Redis, worker, OpenSearch, MinIO,
# Cube e Zipkin, que o compose original traz e a triagem não usa.
#
# Um domínio só: o Traefik entrega tudo à tela (nginx), e o nginx da própria tela
# repassa /api/ para a API pela rede interna. A API e o banco não publicam porta
# nenhuma no host.
#
# Sem `container_name`: os nomes do original (api, db, webapp) podem colidir com
# o que já roda na VPS. Aqui os contêineres saem como gauzy-api-1, gauzy-db-1...
#
# Uso, na pasta deste arquivo:  docker compose -p gauzy -f docker-compose.vps.yml --env-file .env up -d

name: gauzy

x-gauzy-env: &gauzy-env
  env_file:
    - .env

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gauzy}
      POSTGRES_USER: ${DB_USER:-gauzy}
      POSTGRES_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - gauzy_db:/var/lib/postgresql/data/
    mem_limit: 1g
    networks:
      - interna

  api:
    # Só existe a etiqueta `latest` no ghcr.io; fixamos pelo digest para a VPS não
    # trocar de versão sozinha. Para atualizar, troque o digest e suba de novo.
    image: ghcr.io/ever-co/gauzy-api@${GAUZY_API_DIGEST:?defina GAUZY_API_DIGEST no .env}
    <<: *gauzy-env
    entrypoint: './entrypoint.compose.sh'
    command: ['node', 'main.js']
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    mem_limit: 2g
    networks:
      - interna

  webapp:
    image: ghcr.io/ever-co/gauzy-webapp@${GAUZY_WEBAPP_DIGEST:?defina GAUZY_WEBAPP_DIGEST no .env}
    <<: *gauzy-env
    entrypoint: './entrypoint.compose.sh'
    command: ['nginx', '-g', 'daemon off;']
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    mem_limit: 256m
    networks:
      interna: {}
      easypanel:
        aliases:
          - gauzy-webapp

volumes:
  gauzy_db: {}

networks:
  interna:
    driver: bridge
  easypanel:
    external: true
